<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>03 Reveal</title>
<link rel="stylesheet" href="../brand.css">
<script src="../timeline.js"></script>
<script src="../common.js"></script>
<script src="../clutter.js"></script>
<style>
  #wordmark { position: absolute; left: 0; right: 0; top: 400px; text-align: center; font-size: 168px;
              font-weight: 650; letter-spacing: -0.045em; color: var(--navy); }
</style>
</head>
<body>
<div id="stage"></div>
<div id="wordmark">Terratrail</div>
<div id="caption"></div>
<script>
  // Scene 3 (20-26s): the clutter from scene 1 clears, the wordmark arrives.
  // Wordmark is set in Inter as a placeholder until the real logo file is supplied.
  const T = sceneTiming(3);
  const tMark = T.word('terratrail') - 0.25; // wordmark lands with the name
  const clutter = buildClutter(document.getElementById('stage'));
  const mark = document.getElementById('wordmark');

  window.DURATION = T.duration;
  window.seek = (t) => {
    clutter.update(CLUTTER_END, prog(t, 0.1, 1.2));
    const m = ease.out(prog(t, tMark, 0.9));
    mark.style.opacity = m;
    mark.style.transform = `translateY(${lerp(18, 0, m)}px) scale(${lerp(0.985, 1, m)})`;
    setCaption(t, T.cues);
  };
  window.seek(0);
</script>
</body>
</html>
