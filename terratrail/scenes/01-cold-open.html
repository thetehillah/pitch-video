<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>01 Cold open</title>
<link rel="stylesheet" href="../brand.css">
<script src="../timeline.js"></script>
<script src="../common.js"></script>
<script src="../clutter.js"></script>
</head>
<body>
<div id="stage"></div>
<div id="caption"></div>
<script>
  // Scene 1 (0-8s): the manual chaos of installment land sales.
  const T = sceneTiming(1);
  const clutter = buildClutter(document.getElementById('stage'));

  window.DURATION = T.duration;
  window.seek = (t) => {
    clutter.update(t * CLUTTER_END / T.duration, 0); // the 8s build-up, fitted to the voice
    setCaption(t, T.cues);
  };
  window.seek(0);
</script>
</body>
</html>
