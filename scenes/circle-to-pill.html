<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1920px; height: 1080px; background: #fff; overflow: hidden; }
  #shape { position: absolute; left: 50%; top: 50%; height: 240px; background: #000;
           border-radius: 120px; transform: translate(-50%, -50%); }
</style>
<script src="../lib/spring.js"></script>
</head>
<body>
<div id="shape"></div>
<script>
  // Render contract: DURATION in seconds, seek(t) paints frame t from scratch.
  window.DURATION = 2;
  window.seek = (t) => {
    const p = spring(t, { stiffness: 120, damping: 12 });
    document.getElementById('shape').style.width = 240 + (760 - 240) * p + 'px'; // circle -> pill
  };
  window.seek(0);
</script>
</body>
</html>
